<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script src="../js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suta Sensei — Kana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/japan.css" />
  </head>
  <body>
    <div class="top-bar">
      <button class="back-btn" onclick="goBack()" aria-label="Back">←</button>
      <a class="brand" href="../index.html" aria-label="Suta Sensei"><span class="brand-seal" lang="ja">日</span><span>Suta Sensei<small>日本語を学ぼう</small></span></a>
      <div class="topbar-right">
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">
          🃏 Flashcards
        </button>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
          🌙
        </button>
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">
          EN
        </button>
      </div>
    </div>
    <main class="container kana-page">
      <p class="eyebrow" data-lang="kanaEyebrow">LANGKAH PERTAMA &middot; AKSARA JEPANG</p>
      <div class="kana-heading"><div><h1 id="pageTitle">Hiragana</h1>
      <p data-lang="kanaDescription">Kenali 46 huruf dasar. Baca dari kiri ke kanan, baris demi baris.</p></div></div>
      <nav class="kana-tabs" aria-label="Kana"><a href="?type=hiragana" id="hiraganaTab">&#12354; Hiragana</a><a href="?type=katakana" id="katakanaTab">&#12450; Katakana</a></nav>
      <div id="studyView">
        <div class="kana-toolbar"><span data-lang="kanaChart">Goj&#363;on &middot; Tabel 46 huruf dasar</span><label><input type="checkbox" id="romajiToggle" checked onchange="document.getElementById('kanaGrid').classList.toggle('hide-romaji', !this.checked)" /><span data-lang="showRomaji">Tampilkan romaji</span></label></div>
        <div class="kana-grid" id="kanaGrid"></div>
        <p class="kana-footnote" data-lang="kanaNote">Ruang kosong menandakan tidak ada huruf dasar. &#12435; / &#12531; adalah bunyi n yang berdiri sendiri.</p>
      </div>
      <div id="flashcardView" class="flashcard-view hidden">
        <div class="fc-header">
          <span class="fc-progress" id="fcProgress">1 / 46</span>
          <label class="fc-shuffle-label">
            <input
              type="checkbox"
              id="fcShuffle"
              onchange="fcToggleShuffle()"
            />
            <span data-lang="shuffle">Shuffle</span>
          </label>
        </div>
        <div class="fc-scene" role="button" tabindex="0" aria-label="Flip flashcard" onclick="fcFlip()" onkeydown="if(event.key === 'Enter') fcFlip()">
          <div class="fc-card-inner" id="fcCardInner">
            <div class="fc-face fc-front">
              <span class="fc-jp-text" id="fcFront">あ</span>
              <span class="fc-hint" id="fcHint">Tap to flip</span>
            </div>
            <div class="fc-face fc-back">
              <span class="fc-romaji-text" id="fcRomaji">a</span>
            </div>
          </div>
        </div>
        <div class="fc-controls">
          <button class="fc-btn fc-btn-nav" id="fcPrevBtn" onclick="fcPrev()">
            ← Prev
          </button>
          <button
            class="fc-btn fc-btn-reset"
            id="fcResetBtn"
            onclick="fcReset()"
          >
            ↺ Reset
          </button>
          <button class="fc-btn fc-btn-nav" id="fcNextBtn" onclick="fcNext()">
            Next →
          </button>
        </div>
      </div>
    </main>
    <script src="../js/data.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/kana.js"></script>
  </body>
</html>
